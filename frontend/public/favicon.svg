<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Leather cover gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a220b" />
      <stop offset="45%" stop-color="#3d1506" />
      <stop offset="100%" stop-color="#240c03" />
    </linearGradient>

    <!-- Parchment page gradients -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edd9b0" />
      <stop offset="65%" stop-color="#f7ecd0" />
      <stop offset="92%" stop-color="#dfc593" />
      <stop offset="100%" stop-color="#be9d62" />
    </linearGradient>

    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be9d62" />
      <stop offset="8%" stop-color="#dfc593" />
      <stop offset="35%" stop-color="#f7ecd0" />
      <stop offset="100%" stop-color="#edd9b0" />
    </linearGradient>

    <!-- Underpage block gradient for stacked depth -->
    <linearGradient id="pageStackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4b782" />
      <stop offset="100%" stop-color="#7c5324" />
    </linearGradient>

    <!-- Gold illumination gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <radialGradient id="spineShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180701" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#180701" stop-opacity="0" />
    </radialGradient>

    <filter id="softDropShadow" x="-10%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Drop Shadow Group -->
  <g filter="url(#softDropShadow)">
    <!-- 1. Heavy Weathered Leather Tome Cover / Backing -->
    <path d="M 32 47 
             C 24 45, 12 43.5, 4 48
             C 3.5 32, 4 19, 5 15.5
             C 13 11.5, 23.5 13.5, 32 17
             C 40.5 13.5, 51 11.5, 59 15.5
             C 60 19, 60.5 32, 60 48
             C 52 43.5, 40 45, 32 47 Z"
          fill="url(#leatherGrad)"
          stroke="#160702"
          stroke-width="1.6"
          stroke-linejoin="round" />

    <!-- Corner metal edge reinforcements on leather cover -->
    <path d="M 5 15.5 L 10 14 L 6.5 22 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 59 15.5 L 54 14 L 57.5 22 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 4 48 L 9 44 L 6 39 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M 60 48 L 55 44 L 58 39 Z" fill="url(#goldGrad)" opacity="0.75" />

    <!-- 2. Stacked Parchment Leaf Layers (Page Block Edge) -->
    <!-- Lower pages under Left -->
    <path d="M 32 44.5 C 23.5 42.5, 12 42.5, 6 46 C 5.5 33, 6.2 21, 6.8 17.5 C 13.5 14, 23 15.5, 32 18.5 Z"
          fill="url(#pageStackGrad)"
          stroke="#8c6233"
          stroke-width="0.7" />
    <!-- Lower pages under Right -->
    <path d="M 32 44.5 C 40.5 42.5, 52 42.5, 58 46 C 58.5 33, 57.8 21, 57.2 17.5 C 50.5 14, 41 15.5, 32 18.5 Z"
          fill="url(#pageStackGrad)"
          stroke="#8c6233"
          stroke-width="0.7" />

    <!-- 3. Top Open Parchment Pages -->
    <!-- Left Page -->
    <path d="M 32 43 
             C 24 40.5, 13 40.5, 7.5 44 
             C 7 31.5, 7.5 21, 8.2 17.5 
             C 14 14.5, 23.5 15.8, 32 19.2 Z" 
          fill="url(#leftPageGrad)"
          stroke="#a17b44"
          stroke-width="0.8" />

    <!-- Right Page -->
    <path d="M 32 43 
             C 40 40.5, 51 40.5, 56.5 44 
             C 57 31.5, 56.5 21, 55.8 17.5 
             C 50 14.5, 40.5 15.8, 32 19.2 Z" 
          fill="url(#rightPageGrad)"
          stroke="#a17b44"
          stroke-width="0.8" />

    <!-- Deckled / aged page curling accent line -->
    <path d="M 8.2 17.5 C 14 15, 23 16.2, 31.8 19.4" fill="none" stroke="#68471c" stroke-width="0.6" />
    <path d="M 55.8 17.5 C 50 15, 41 16.2, 32.2 19.4" fill="none" stroke="#68471c" stroke-width="0.6" />
  </g>

  <!-- 4. Deep Spine Creep Shadow & Gutter -->
  <path d="M 30.5 19 Q 32 31 30.5 43.5 L 33.5 43.5 Q 32 31 33.5 19 Z" fill="#2b1509" opacity="0.65" />
  <line x1="32" y1="18.5" x2="32" y2="44.5" stroke="#1c0a03" stroke-width="1.2" stroke-linecap="round" />

  <!-- 5. Ancient Arcane Runic Inscriptions & Text Lines (Left Page) -->
  <!-- Header Runic Sigil / Drop Cap -->
  <circle cx="14" cy="22.5" r="2.8" fill="none" stroke="#842617" stroke-width="0.8" opacity="0.8" />
  <path d="M 14 20.3 L 14 24.7 M 11.8 22.5 L 16.2 22.5" stroke="#842617" stroke-width="0.7" opacity="0.8" />
  
  <line x1="18.5" y1="21.5" x2="28" y2="23.2" stroke="#4a3621" stroke-width="0.9" stroke-linecap="round" opacity="0.75" />
  <line x1="18.5" y1="23.8" x2="28" y2="25.5" stroke="#4a3621" stroke-width="0.9" stroke-linecap="round" opacity="0.75" />

  <line x1="11.5" y1="27.5" x2="28" y2="29.5" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />
  <line x1="11.5" y1="31" x2="27.5" y2="33" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />
  <line x1="12" y1="34.5" x2="28" y2="36.5" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />
  <line x1="12" y1="38" x2="24" y2="39.8" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

  <!-- 6. Ancient Arcane Diagram / Celestial Map (Right Page) -->
  <!-- Arcane compass / spell circle -->
  <circle cx="44" cy="27" r="5.2" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="1.2,1" opacity="0.85" />
  <polygon points="44,22.8 45.5,26.2 49,27 45.5,27.8 44,31.2 42.5,27.8 39,27 42.5,26.2" fill="url(#goldGrad)" opacity="0.9" />

  <line x1="36" y1="34" x2="52.5" y2="32.5" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />
  <line x1="36" y1="37.5" x2="52.5" y2="36" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />
  <line x1="36" y1="41" x2="47" y2="39.8" stroke="#543c22" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

  <!-- 7. Embroidered Gold & Crimson Silk Bookmark Ribbon flowing from the spine -->
  <path d="M 32 19 
           C 32.5 13, 31 8, 29 5 
           C 27.5 3, 26 3.5, 27 6
           C 28.5 10, 30.5 14, 31.2 19 Z" 
        fill="#991b1b" 
        stroke="#7f1d1d" 
        stroke-width="0.4" />

  <!-- Hanging Bottom Ribbon Tail -->
  <path d="M 32 43 
           C 31.8 47, 33 52, 34.5 56 
           L 32 58.5 
           L 38 58 
           C 36 53, 34 48, 33 43 Z" 
        fill="url(#goldGrad)" 
        stroke="#92400e" 
        stroke-width="0.5" />

  <!-- 8. Subtle magical sparkle motes above the tome -->
  <path d="M 23 11 Q 24 12.5 25 11 Q 24 9.5 23 11 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M 42 9 Q 43 10.5 44 9 Q 43 7.5 42 9 Z" fill="#fbbf24" opacity="0.9" />
</svg>